name: Promote Latest to Stable

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Profile to promote (all = gnome + plasma)'
        required: true
        type: choice
        options:
          - all
          - gnome
          - plasma
          - cosmic
  schedule:
    # One day after build-image's Friday 20:30 UTC build (Sat ~2:00 AM IST).
    # Saturday 20:30 UTC → Sunday 2:00 AM IST.
    - cron: '30 20 * * 6'

concurrency:
  group: promote-stable
  cancel-in-progress: false

jobs:
  promote-stable:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      id-token: write

    strategy:
      matrix:
        profile: ${{ github.event_name == 'schedule' && fromJson('["gnome", "plasma"]') || fromJson(github.event.inputs.profile != 'all' && format('["{0}"]', github.event.inputs.profile) || '["gnome", "plasma"]') }}
      fail-fast: false

    env:
      SSH_PRIVATE_KEY:      ${{ secrets.SSH_PRIVATE_KEY }}
      R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET:            ${{ secrets.R2_BUCKET }}

    steps:
      - name: Notify Telegram — Promotion Started
        if: github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ] && exit 0
          MSG=$(jq -n --arg profile "${{ matrix.profile }}" --arg ref "${{ github.ref_name }}" '{text: ("🔄 **ShaniOS Promotion Started**\nProfile: `" + $profile + "`\nBranch: `" + $ref + "`")}')
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg chat "$TELEGRAM_CHAT_ID" --argjson msg "$MSG" '{chat_id: $chat, text: $msg.text, parse_mode: "Markdown"}')" || true

      - name: Checkout shani-install-media
        uses: actions/checkout@v4
        with:
          repository: shani8dev/shani-install-media
          path: shani-install-media
          fetch-depth: 0

      - name: Make scripts executable
        run: chmod +x shani-install-media/run_in_container.sh shani-install-media/build.sh

      - name: Validate SSH deploy key
        run: |
          if [ -n "${{ secrets.SSH_PRIVATE_KEY }}" ]; then
            echo "SSH_PRIVATE_KEY is set — validating format..."
            echo "${{ secrets.SSH_PRIVATE_KEY }}" > /tmp/deploy_key
            chmod 600 /tmp/deploy_key
            if ! ssh-keygen -y -f /tmp/deploy_key >/dev/null 2>&1; then
              echo "::warning::SSH_PRIVATE_KEY could not be parsed as a private key."
            else
              echo "SSH key format is valid."
            fi
            rm -f /tmp/deploy_key
          fi

      - name: Promote latest to stable — ${{ matrix.profile }}
        working-directory: shani-install-media
        run: sudo --preserve-env bash run_in_container.sh build.sh promote-stable -p "${{ matrix.profile }}"

      - name: Notify Telegram — Promotion Failed
        if: failure() && github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ] && exit 0
          MSG=$(jq -n --arg profile "${{ matrix.profile }}" --arg ref "${{ github.ref_name }}" --arg run_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" '{text: ("❌ **ShaniOS Promotion Failed**\nProfile: `" + $profile + "`\nBranch: `" + $ref + "`\n[View logs](" + $run_url + ")")}')
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg chat "$TELEGRAM_CHAT_ID" --argjson msg "$MSG" '{chat_id: $chat, text: $msg.text, parse_mode: "Markdown"}')" || true

      - name: Notify Telegram — Promotion Succeeded
        if: success() && github.event_name == 'workflow_dispatch'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ] && exit 0
          MSG=$(jq -n --arg profile "${{ matrix.profile }}" --arg ref "${{ github.ref_name }}" '{text: ("✅ **ShaniOS Promotion Complete**\nProfile: `" + $profile + "`\nBranch: `" + $ref + "`")}')
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg chat "$TELEGRAM_CHAT_ID" --argjson msg "$MSG" '{chat_id: $chat, text: $msg.text, parse_mode: "Markdown"}')" || true
