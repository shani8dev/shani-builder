name: Build

on:
  push:
    branches: [main]
    paths:
      # docker/** deliberately absent: the Docker image (build + push + secrets
      # scan) is owned by build-docker.yaml, which fires on docker/** pushes.
      # Re-adding docker/** here double-builds every Docker change.
      - 'pkg/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    uses: shani8dev/shani-ci-commons/.github/workflows/build.yml@main
    with:
      build-type: docker

  security:
    name: Security
    uses: shani8dev/shani-ci-commons/.github/workflows/security.yml@main
    with:
      # shani-builder tracks no keyring files, so the keyring-checksum branch
      # of security.yml (which runs tests/test-check-keyring-sync.sh from the
      # caller repo root) is meaningless here — and that harness only exists
      # in shani-pkgbuilds. Use secrets-scan only.
      scan-type: secrets
    needs: build
