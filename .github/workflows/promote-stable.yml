name: Promote Latest to Stable

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Profile to promote (all = gnome + plasma)'
        required: true
        type: choice
        options:
          - all
          - gnome
          - plasma
          - cosmic
      gate_only:
        description: 'Only run the release gate (test), do not promote'
        required: false
        type: boolean
        default: false
  schedule:
    # One day after build-image's Friday 20:30 UTC build (Sat ~2:00 AM IST).
    # Saturday 20:30 UTC → Sunday 2:00 AM IST.
    - cron: '30 20 * * 6'

concurrency:
  group: promote-stable
  cancel-in-progress: false

jobs:
  # Only a build that passed shani-testbed's release gate is promoted: the
  # PUBLISHED candidate ISO installed and upgraded to the candidate image,
  # and current stable upgraded to it, both by the self-updated shani-deploy
  # and rolled back (identity, verify-boot, slot-tests, desktop). The gate
  # writes what it tested; promote-stable.sh --expect/--expect-iso refuse
  # if latest.txt / iso-latest.txt moved meanwhile.
  promote-stable:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    permissions:
      contents: read

    strategy:
      matrix:
        profile: ${{ github.event_name == 'schedule' && fromJson('["gnome", "plasma"]') || fromJson(github.event.inputs.profile != 'all' && format('["{0}"]', github.event.inputs.profile) || '["gnome", "plasma"]') }}
      fail-fast: false

    steps:
      - name: Notify Telegram — Promotion Started
        if: github.event_name == 'workflow_dispatch'
        uses: shani8dev/shani-ci-commons/.github/actions/send-telegram@main
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: started
          message: |-
            **ShaniOS Promotion Started**
            Profile: `${{ matrix.profile }}`
            Branch: `${{ github.ref_name }}`

      - name: Checkout shani-install-media
        uses: actions/checkout@v4
        with:
          repository: shani8dev/shani-install-media
          path: shani-install-media
          fetch-depth: 0
          persist-credentials: false

      # the harness and the installer it runs are siblings of shani-install-media
      # (run_in_container.sh mounts ../shani-testbed and ../os-installer-config)
      - name: Checkout shani-testbed
        uses: actions/checkout@v4
        with:
          repository: shani8dev/shani-testbed
          path: shani-testbed
          persist-credentials: false

      - name: Checkout os-installer-config
        uses: actions/checkout@v4
        with:
          repository: shani8dev/os-installer-config
          path: os-installer-config
          persist-credentials: false

      - name: Free disk space for the gate
        run: |
          # an ~8 GB ISO, two ~3 GB images, a 24G sparse install disk, overlays
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null
          df -h /

      - name: Make scripts executable
        run: chmod +x shani-install-media/run_in_container.sh shani-install-media/build.sh

      - name: Release gate — ${{ matrix.profile }}
        working-directory: shani-install-media
        run: sudo bash run_in_container.sh build.sh test gate -p "${{ matrix.profile }}"

      - name: Upload gate results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-${{ matrix.profile }}
          path: |
            shani-install-media/test-env/disk/gate-*.json
            shani-install-media/test-env/disk/*-console.log
            shani-install-media/test-env/shots/gate-*.png
          if-no-files-found: warn

      - name: Validate SSH deploy key
        if: ${{ !inputs.gate_only }}
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          # SSH_PRIVATE_KEY comes from the job-level env: block. Don't inline
          # a secrets expression here: it is pasted into the script text.
          if [ -n "${SSH_PRIVATE_KEY:-}" ]; then
            echo "SSH_PRIVATE_KEY is set — validating format..."
            key_file=$(mktemp)
            chmod 600 "$key_file"
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
            if ! ssh-keygen -y -f "$key_file" >/dev/null 2>&1; then
              echo "::warning::SSH_PRIVATE_KEY could not be parsed as a private key."
            else
              echo "SSH key format is valid."
            fi
            rm -f "$key_file"
          fi

      # secrets only here, not in the job env: the gate runs harness code
      # and published images and needs none
      - name: Promote the tested build to stable — ${{ matrix.profile }}
        if: ${{ !inputs.gate_only }}
        working-directory: shani-install-media
        env:
          SSH_PRIVATE_KEY:      ${{ secrets.SSH_PRIVATE_KEY }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET:            ${{ secrets.R2_BUCKET }}
        run: |
          # line 1: the tested image, line 2: the tested ISO folder
          mapfile -t tested < "test-env/disk/gate-${{ matrix.profile }}.passed"
          sudo --preserve-env bash run_in_container.sh build.sh promote-stable -p "${{ matrix.profile }}" \
            --expect="${tested[0]}" --expect-iso="${tested[1]}"

      - name: Notify Telegram — Promotion Failed
        if: failure() && github.event_name == 'workflow_dispatch'
        uses: shani8dev/shani-ci-commons/.github/actions/send-telegram@main
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: failure
          message: |-
            **ShaniOS Promotion Failed**
            Profile: `${{ matrix.profile }}`
            Branch: `${{ github.ref_name }}`
            [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Notify Telegram — Promotion Succeeded
        if: success() && github.event_name == 'workflow_dispatch' && !inputs.gate_only
        uses: shani8dev/shani-ci-commons/.github/actions/send-telegram@main
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: success
          message: |-
            **ShaniOS Promotion Complete**
            Profile: `${{ matrix.profile }}`
            Branch: `${{ github.ref_name }}`
