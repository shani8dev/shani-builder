name: Promote Latest to Stable

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Profile to promote (all = gnome + plasma)'
        required: true
        type: choice
        options:
          - all
          - gnome
          - plasma
          - cosmic
      artifact:
        description: 'What to gate and promote (the base image and the ISO are built and promoted separately)'
        required: true
        type: choice
        default: all
        options:
          - all
          - image
          - iso
      gate_only:
        description: 'Only run the release gate (test), do not promote'
        required: false
        type: boolean
        default: false
  schedule:
    # One day after build-image's Friday 20:30 UTC build (Sat ~2:00 AM IST).
    # Saturday 20:30 UTC → Sunday 2:00 AM IST.
    - cron: '30 20 * * 6'

concurrency:
  group: promote-stable
  cancel-in-progress: false

jobs:
  # Only what passed shani-testbed's release gate is promoted, the image and
  # the ISO separately. ISO: the published candidate ISO booted under UEFI,
  # installed by its own installer, first-updated as the timer would. Image:
  # a new user (ISO install -> candidate) and an existing user (stable ->
  # candidate), each by the self-updated shani-deploy and rolled back. The
  # gate writes gate-<profile>.{image,iso}.passed; promote-stable.sh --only
  # with --expect / --expect-iso refuses if a pointer moved meanwhile.
  promote-stable:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    permissions:
      contents: read

    strategy:
      matrix:
        profile: ${{ github.event_name == 'schedule' && fromJson('["gnome", "plasma"]') || fromJson(github.event.inputs.profile != 'all' && format('["{0}"]', github.event.inputs.profile) || '["gnome", "plasma"]') }}
        artifact: ${{ (github.event_name == 'schedule' || github.event.inputs.artifact == 'all') && fromJson('["image", "iso"]') || fromJson(format('["{0}"]', github.event.inputs.artifact)) }}
      fail-fast: false

    steps:
      # latest == stable (or iso-latest == iso-stable): nothing new was
      # published for this artifact - skip the hour-long gate on a schedule.
      # A manual dispatch always runs.
      - name: Anything new to gate? — ${{ matrix.profile }} ${{ matrix.artifact }}
        id: new
        env:
          PROFILE: ${{ matrix.profile }}
          ARTIFACT: ${{ matrix.artifact }}
          EVENT: ${{ github.event_name }}
        run: |
          base=https://downloads.shani.dev/${PROFILE}
          get() { curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors --max-time 30 "$base/$1.txt" 2>/dev/null | tr -d '[:space:]'; }
          if [ "$ARTIFACT" = iso ]; then cand=$(get iso-latest); cur=$(get iso-stable); else cand=$(get latest); cur=$(get stable); fi
          echo "candidate=${cand:-none} current stable=${cur:-none}"
          if [ -z "$cand" ]; then echo "::notice::no ${ARTIFACT} candidate published for ${PROFILE}"; echo run=false >> "$GITHUB_OUTPUT"
          elif [ "$cand" = "$cur" ] && [ "$EVENT" = schedule ]; then echo "::notice::${PROFILE} ${ARTIFACT} ${cand} is already stable - nothing to gate"; echo run=false >> "$GITHUB_OUTPUT"
          else echo run=true >> "$GITHUB_OUTPUT"; fi

      - name: Notify Telegram — Promotion Started
        if: github.event_name == 'workflow_dispatch'
        uses: shani8dev/shani-ci-commons/.github/actions/send-telegram@main
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: started
          message: |-
            **ShaniOS Promotion Started**
            Profile: `${{ matrix.profile }}`
            Branch: `${{ github.ref_name }}`

      - name: Checkout shani-install-media
        if: steps.new.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: shani8dev/shani-install-media
          path: shani-install-media
          fetch-depth: 0
          persist-credentials: false

      # the harness and the installer it runs are siblings of shani-install-media
      # (run_in_container.sh mounts ../shani-testbed and ../os-installer-config)
      - name: Checkout shani-testbed
        if: steps.new.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: shani8dev/shani-testbed
          path: shani-testbed
          persist-credentials: false

      - name: Checkout os-installer-config
        if: steps.new.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: shani8dev/os-installer-config
          path: os-installer-config
          persist-credentials: false

      - name: Free disk space for the gate
        if: steps.new.outputs.run == 'true'
        run: |
          # an ~8 GB ISO, two ~3 GB images, a 24G sparse install disk, overlays
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null
          df -h /

      - name: Make scripts executable
        if: steps.new.outputs.run == 'true'
        run: chmod +x shani-install-media/run_in_container.sh shani-install-media/build.sh

      - name: Release gate — ${{ matrix.profile }} ${{ matrix.artifact }}
        if: steps.new.outputs.run == 'true'
        working-directory: shani-install-media
        run: sudo bash run_in_container.sh build.sh test gate -p "${{ matrix.profile }}" --for="${{ matrix.artifact }}"

      - name: Upload gate results
        if: always() && steps.new.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: gate-${{ matrix.profile }}-${{ matrix.artifact }}
          path: |
            shani-install-media/test-env/disk/gate-*.json
            shani-install-media/test-env/disk/*-console.log
            shani-install-media/test-env/shots/gate-*.png
          if-no-files-found: warn

      # The image and the ISO are promoted separately, each only if the gate
      # wrote its marker: a failing ISO must not hold back a tested image
      # (or the reverse). !cancelled() lets them run after the gate step
      # failed on the other artifact; the job still shows the failure.
      - name: Validate SSH deploy key
        if: ${{ !cancelled() && !inputs.gate_only && (hashFiles(format('shani-install-media/test-env/disk/gate-{0}.image.passed', matrix.profile)) != '' || hashFiles(format('shani-install-media/test-env/disk/gate-{0}.iso.passed', matrix.profile)) != '') }}
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          # SSH_PRIVATE_KEY comes from the job-level env: block. Don't inline
          # a secrets expression here: it is pasted into the script text.
          if [ -n "${SSH_PRIVATE_KEY:-}" ]; then
            echo "SSH_PRIVATE_KEY is set — validating format..."
            key_file=$(mktemp)
            chmod 600 "$key_file"
            printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
            if ! ssh-keygen -y -f "$key_file" >/dev/null 2>&1; then
              echo "::warning::SSH_PRIVATE_KEY could not be parsed as a private key."
            else
              echo "SSH key format is valid."
            fi
            rm -f "$key_file"
          fi

      # secrets only here, not in the job env: the gate runs harness code
      # and published images and needs none
      - name: Promote the tested base image — ${{ matrix.profile }}
        if: ${{ !cancelled() && !inputs.gate_only && matrix.artifact == 'image' && hashFiles(format('shani-install-media/test-env/disk/gate-{0}.image.passed', matrix.profile)) != '' }}
        working-directory: shani-install-media
        env:
          SSH_PRIVATE_KEY:      ${{ secrets.SSH_PRIVATE_KEY }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET:            ${{ secrets.R2_BUCKET }}
        run: |
          tested="$(cat "test-env/disk/gate-${{ matrix.profile }}.image.passed")"
          sudo --preserve-env bash run_in_container.sh build.sh promote-stable -p "${{ matrix.profile }}" \
            --only=image --expect="${tested}"

      - name: Promote the tested ISO — ${{ matrix.profile }}
        if: ${{ !cancelled() && !inputs.gate_only && matrix.artifact == 'iso' && hashFiles(format('shani-install-media/test-env/disk/gate-{0}.iso.passed', matrix.profile)) != '' }}
        working-directory: shani-install-media
        env:
          SSH_PRIVATE_KEY:      ${{ secrets.SSH_PRIVATE_KEY }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET:            ${{ secrets.R2_BUCKET }}
        run: |
          tested="$(cat "test-env/disk/gate-${{ matrix.profile }}.iso.passed")"
          sudo --preserve-env bash run_in_container.sh build.sh promote-stable -p "${{ matrix.profile }}" \
            --only=iso --expect-iso="${tested}"

      - name: Notify Telegram — Promotion Failed
        if: failure() && github.event_name == 'workflow_dispatch'
        uses: shani8dev/shani-ci-commons/.github/actions/send-telegram@main
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: failure
          message: |-
            **ShaniOS Promotion Failed**
            Profile: `${{ matrix.profile }}`
            Branch: `${{ github.ref_name }}`
            [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Notify Telegram — Promotion Succeeded
        if: success() && github.event_name == 'workflow_dispatch' && !inputs.gate_only
        uses: shani8dev/shani-ci-commons/.github/actions/send-telegram@main
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: success
          message: |-
            **ShaniOS Promotion Complete**
            Profile: `${{ matrix.profile }}`
            Branch: `${{ github.ref_name }}`
