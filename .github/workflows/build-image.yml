name: Build Image and Upload

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Profile to build (leave empty for all)'
        required: false
        type: choice
        options:
          # '' is intentional and required: default: '' ("all profiles") must
          # be one of the options for a workflow_dispatch choice input. The
          # matrix below maps '' -> ['gnome', 'plasma'].
          - ''
          - gnome
          - plasma
          - cosmic
        default: ''
      build_mode:
        description: 'Build mode: all (base image + upload), iso-release (Flatpak/Snap + ISO around the STABLE image + upload iso) or full (everything at once, ISO from the new image). Scheduled: image weekly, iso-release every even ISO week.'
        required: false
        type: choice
        options:
          - all
          - iso-release
          - full
        default: all
  schedule:
    # Every Friday 20:30 UTC → Saturday 2:00 AM IST: the base image weekly;
    # the ISO (iso-release) only in even ISO weeks - cron has no "every
    # other week", so the plan step below checks `date +%V`.
    - cron: '30 20 * * 5'

concurrency:
  group: image-build
  cancel-in-progress: false

jobs:
  build-release-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      matrix:
        profile: ${{ fromJson(github.event.inputs.profile != '' && format('["{0}"]', github.event.inputs.profile) || '["gnome", "plasma"]') }}
        # image and ISO are separate artifacts: separate jobs, run in parallel
        task: ${{ github.event_name == 'schedule' && fromJson('["image", "iso"]') || fromJson(github.event.inputs.build_mode == 'iso-release' && '["iso"]' || '["image"]') }}
      fail-fast: false

    permissions:
      contents: read

    env:
      SSH_PRIVATE_KEY:      ${{ secrets.SSH_PRIVATE_KEY }}
      GPG_PRIVATE_KEY:      ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE:       ${{ secrets.GPG_PASSPHRASE }}
      GPG_KEY_ID:           ${{ secrets.GPG_KEY_ID }}
      R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET:            ${{ secrets.R2_BUCKET }}

    steps:
      - name: Plan — ${{ matrix.profile }} ${{ matrix.task }}
        id: plan
        env:
          TASK: ${{ matrix.task }}
          EVENT: ${{ github.event_name }}
          INPUT_MODE: ${{ github.event.inputs.build_mode }}
        run: |
          if [ "$EVENT" != schedule ]; then mode="${INPUT_MODE:-all}"
          elif [ "$TASK" = image ]; then mode=all
          elif [ $(( 10#$(date -u +%V) % 2 )) -eq 0 ]; then mode=iso-release
          else mode=""; echo "::notice::odd ISO week $(date -u +%V) - no ISO build this week"; fi
          case "$mode" in all) verify=image ;; full) verify=all ;; iso-release) verify=iso ;; *) verify="" ;; esac
          { echo "mode=${mode}"; echo "verify=${verify}"
            echo "run=$([ -n "$mode" ] && echo true || echo false)"; } >> "$GITHUB_OUTPUT"
          echo "plan: ${mode:-nothing} (verify ${verify:-none})"

      - name: Notify Telegram — Build Started
        if: github.event_name == 'workflow_dispatch'
        uses: shani8dev/shani-ci-commons/.github/actions/send-telegram@main
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: started
          message: |-
            **ShaniOS Image Build Started**
            Profile: `${{ matrix.profile }}`
            Branch: `${{ github.ref_name }}`
            SHA: `${{ github.sha }}`

      - name: Free disk space
        if: steps.plan.outputs.run == 'true'
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/lib/jvm \
            /usr/local/share/boost \
            "${AGENT_TOOLSDIRECTORY:-}"
          df -h /

      - name: Checkout shani-install-media
        if: steps.plan.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: shani8dev/shani-install-media
          path: shani-install-media
          clean: true
          fetch-depth: 0
          persist-credentials: false

      - name: Make scripts executable
        if: steps.plan.outputs.run == 'true'
        run: chmod +x shani-install-media/run_in_container.sh shani-install-media/build.sh

      - name: Setup MOK keys
        if: steps.plan.outputs.run == 'true'
        # Secrets via env, not ${{ }} inside run: — inline expressions are
        # pasted into the script text before bash parses it.
        env:
          MOK_KEY: ${{ secrets.MOK_KEY }}
          MOK_CRT: ${{ secrets.MOK_CRT }}
          MOK_DER: ${{ secrets.MOK_DER }}
        run: |
          mkdir -p shani-install-media/keys/mok
          printf '%s\n' "$MOK_KEY" > shani-install-media/keys/mok/MOK.key
          printf '%s\n' "$MOK_CRT" > shani-install-media/keys/mok/MOK.crt
          printf '%s\n' "$MOK_DER" | base64 --decode \
            > shani-install-media/keys/mok/MOK.der

      - name: Export GPG public key
        if: steps.plan.outputs.run == 'true'
        run: |
          mkdir -p shani-install-media/keys/gpg
          TMPGNUPG="$(mktemp -d)"
          chmod 700 "$TMPGNUPG"
          printf '%s\n' "$GPG_PRIVATE_KEY" \
            | gpg --homedir "$TMPGNUPG" --batch --import
          gpg --homedir "$TMPGNUPG" \
              --batch --armor \
              --export "$GPG_KEY_ID" \
              > shani-install-media/keys/gpg/gpg-public.asc
          rm -rf "$TMPGNUPG"

      - name: Build and upload (${{ steps.plan.outputs.mode }}) — ${{ matrix.profile }}
        if: steps.plan.outputs.run == 'true'
        working-directory: shani-install-media
        run: sudo --preserve-env bash run_in_container.sh build.sh "${{ steps.plan.outputs.mode }}" -p "${{ matrix.profile }}"

      - name: Verify uploaded artifacts (${{ steps.plan.outputs.verify }}) — ${{ matrix.profile }}
        if: steps.plan.outputs.run == 'true'
        working-directory: shani-install-media
        run: sudo --preserve-env bash run_in_container.sh build.sh verify -p "${{ matrix.profile }}" "${{ steps.plan.outputs.verify }}"

      - name: Notify Telegram — Build Failed
        if: failure() && github.event_name == 'workflow_dispatch'
        uses: shani8dev/shani-ci-commons/.github/actions/send-telegram@main
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: failure
          message: |-
            **ShaniOS Image Build Failed**
            Profile: `${{ matrix.profile }}`
            Branch: `${{ github.ref_name }}`
            [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Resolve R2 artifact URLs — ${{ matrix.profile }}
        if: steps.plan.outputs.run == 'true'
        id: resolve
        # Links for what THIS run published, HEAD-verified so the notification
        # only carries URLs that resolve: the base image for `all`, the ISO for
        # `iso-release`, both for `full`. (It used to always emit the ISO -
        # for an image-only build that was the previous, unrelated ISO.)
        #   - base image: shanios-YYYYMMDD-<profile>.zst, named by latest.txt
        #   - signed ISO: signed_shanios-<profile>-YYYY.MM.DD-x86_64.iso
        #     (dotted date); iso-latest.txt holds just the 8-digit date
        env:
          MODE: ${{ steps.plan.outputs.mode }}
          PROFILE: ${{ matrix.profile }}
        run: |
          BASE_URL="${R2_BASE_URL:-https://downloads.shani.dev}"
          verify() {
            local url="$1" out="$2"
            if curl -fsSL --max-time 20 --head "$url" >/dev/null 2>&1; then
              echo "${out}=${url}" >> "$GITHUB_OUTPUT"
            else
              echo "${out}=" >> "$GITHUB_OUTPUT"
              echo "::warning::Not reachable, omitting from notification: ${url}"
            fi
          }
          get() { curl -fsSL --max-time 30 --retry 2 --retry-delay 2 "${BASE_URL}/${PROFILE}/$1" 2>/dev/null | tr -d '[:space:]' || true; }

          if [[ "$MODE" == all || "$MODE" == full ]]; then
            img="$(get latest.txt)"; img_date="$(grep -oE '[0-9]{8}' <<<"$img" | head -n1 || true)"
            if [[ -n "$img_date" ]]; then
              verify "${BASE_URL}/${PROFILE}/${img_date}/${img}"        image_url
              verify "${BASE_URL}/${PROFILE}/${img_date}/${img}.sha256" image_sha256_url
              verify "${BASE_URL}/${PROFILE}/${img_date}/${img}.asc"    image_asc_url
            else
              echo "::warning::latest.txt empty/unreachable for ${PROFILE}"
            fi
          fi

          if [[ "$MODE" == iso-release || "$MODE" == full ]]; then
            iso_date="$(grep -oE '[0-9]{8}' <<<"$(get iso-latest.txt)" | head -n1 || true)"
            if [[ -n "$iso_date" ]]; then
              iso_dot="$(sed -E 's/([0-9]{4})([0-9]{2})([0-9]{2})/\1.\2.\3/' <<<"$iso_date")"
              ISO_NAME="signed_shanios-${PROFILE}-${iso_dot}-x86_64.iso"
              ISO_DIR="${BASE_URL}/${PROFILE}/${iso_date}"
              verify "${ISO_DIR}/${ISO_NAME}"         iso_url
              verify "${ISO_DIR}/${ISO_NAME}.torrent" torrent_url
              verify "${ISO_DIR}/${ISO_NAME}.asc"     asc_url
              verify "${ISO_DIR}/${ISO_NAME}.sha256"  sha256_url
            else
              echo "::warning::No ISO on R2 for ${PROFILE} (iso-latest.txt empty/unreachable)"
            fi
          fi

      - name: Notify Telegram — Build Succeeded
        if: success() && github.event_name == 'workflow_dispatch' && steps.plan.outputs.run == 'true'
        uses: shani8dev/shani-ci-commons/.github/actions/send-telegram@main
        with:
          bot-token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          chat-id: ${{ secrets.TELEGRAM_CHAT_ID }}
          status: success
          # repo-name left empty on purpose: the composite's inline-caller
          # shape prepends only the status emoji and renders the message
          # verbatim, whereas the repo-name shape wraps it as
          # "**REPO** — MESSAGE (status)" — which would double up the
          # wording here since the message already says "Build Complete".
          repo-name: ""
          message: |-
            **ShaniOS Build Complete**
            Profile: `${{ matrix.profile }}`
            Branch: `${{ github.ref_name }}`
            SHA: `${{ github.sha }}`
            Built: `${{ steps.plan.outputs.mode }}`
            ${{ steps.resolve.outputs.image_url != '' && format('Image: [{0}]({0})', steps.resolve.outputs.image_url) || '' }}
            ${{ steps.resolve.outputs.image_sha256_url != '' && format('Image SHA-256: [{0}]({0})', steps.resolve.outputs.image_sha256_url) || '' }}
            ${{ steps.resolve.outputs.image_asc_url != '' && format('Image signature: [{0}]({0})', steps.resolve.outputs.image_asc_url) || '' }}
            ${{ steps.resolve.outputs.iso_url != '' && format('ISO: [{0}]({0})', steps.resolve.outputs.iso_url) || '' }}
            ${{ steps.resolve.outputs.torrent_url != '' && format('Torrent: [{0}]({0})', steps.resolve.outputs.torrent_url) || '' }}
            ${{ steps.resolve.outputs.asc_url != '' && format('Signature: [{0}]({0})', steps.resolve.outputs.asc_url) || '' }}
            ${{ steps.resolve.outputs.sha256_url != '' && format('SHA-256: [{0}]({0})', steps.resolve.outputs.sha256_url) || '' }}
