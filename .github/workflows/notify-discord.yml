name: Notify Discord

on:
  workflow_dispatch:
    inputs:
      message:
        description: 'Notification message'
        required: false
        default: 'Build notification'
      status:
        description: 'Status (started, failed, success)'
        required: true
        type: choice
        options: [started, failed, success]
      repo-name:
        description: 'Display name of the repo'
        required: true
        type: string
        default: 'ShaniOS Builder'

jobs:
  notify:
    uses: shani8dev/shani-ci-commons/.github/workflows/notify-discord.yml@main
    with:
      message: ${{ inputs.message }}
      status: ${{ inputs.status }}
      repo-name: ${{ inputs.repo-name }}
    secrets:
      DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
