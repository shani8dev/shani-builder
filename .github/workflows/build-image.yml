name: Build Image and Upload

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Profile to build (leave empty for all)'
        required: false
        type: choice
        options:
          # '' is intentional and required: default: '' ("all profiles") must
          # be one of the options for a workflow_dispatch choice input. The
          # matrix below maps '' -> ['gnome', 'plasma'].
          - ''
          - gnome
          - plasma
          - cosmic
        default: ''
      build_mode:
        description: 'Build mode: all (image + release + upload) or full (all + iso + repack + upload all)'
        required: false
        type: choice
        options:
          - all
          - full
        default: all
  schedule:
    # Every Friday 20:30 UTC → Saturday 2:00 AM IST
    - cron: '30 20 * * 5'

concurrency:
  group: image-build
  cancel-in-progress: false

jobs:
  build-release-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      matrix:
        profile: ${{ fromJson(github.event.inputs.profile != '' && format('["{0}"]', github.event.inputs.profile) || '["gnome", "plasma"]') }}
      fail-fast: false

    permissions:
      contents: read
      id-token: write

    env:
      SSH_PRIVATE_KEY:      ${{ secrets.SSH_PRIVATE_KEY }}
      GPG_PRIVATE_KEY:      ${{ secrets.GPG_PRIVATE_KEY }}
      GPG_PASSPHRASE:       ${{ secrets.GPG_PASSPHRASE }}
      GPG_KEY_ID:           ${{ secrets.GPG_KEY_ID }}
      R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET:            ${{ secrets.R2_BUCKET }}

    steps:
      - name: Notify Telegram — Build Started
        if: github.event_name == 'workflow_dispatch'
        uses: shani8dev/shani-ci-commons/.github/actions/send-telegram@main
        with:
          status: started
          message: |-
            **ShaniOS Image Build Started**
            Profile: `${{ matrix.profile }}`
            Branch: `${{ github.ref_name }}`
            SHA: `${{ github.sha }}`

      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/lib/jvm \
            /usr/local/share/boost \
            "${AGENT_TOOLSDIRECTORY:-}"
          df -h /

      - name: Checkout shani-install-media
        uses: actions/checkout@v4
        with:
          repository: shani8dev/shani-install-media
          path: shani-install-media
          clean: true
          fetch-depth: 0

      - name: Make scripts executable
        run: chmod +x shani-install-media/run_in_container.sh shani-install-media/build.sh

      - name: Setup MOK keys
        run: |
          mkdir -p shani-install-media/keys/mok
          printf '%s\n' "${{ secrets.MOK_KEY }}"  > shani-install-media/keys/mok/MOK.key
          printf '%s\n' "${{ secrets.MOK_CRT }}"  > shani-install-media/keys/mok/MOK.crt
          printf '%s\n' "${{ secrets.MOK_DER }}" | base64 --decode \
            > shani-install-media/keys/mok/MOK.der

      - name: Export GPG public key
        run: |
          mkdir -p shani-install-media/keys/gpg
          TMPGNUPG="$(mktemp -d)"
          chmod 700 "$TMPGNUPG"
          printf '%s\n' "$GPG_PRIVATE_KEY" \
            | gpg --homedir "$TMPGNUPG" --batch --import
          gpg --homedir "$TMPGNUPG" \
              --batch --armor \
              --export "$GPG_KEY_ID" \
              > shani-install-media/keys/gpg/gpg-public.asc
          rm -rf "$TMPGNUPG"

      - name: Build and upload — ${{ matrix.profile }}
        if: ${{ github.event_name == 'schedule' || github.event.inputs.build_mode != 'full' }}
        working-directory: shani-install-media
        run: sudo --preserve-env bash run_in_container.sh build.sh all -p "${{ matrix.profile }}"

      - name: Full pipeline — ${{ matrix.profile }}
        if: ${{ github.event_name != 'schedule' && github.event.inputs.build_mode == 'full' }}
        working-directory: shani-install-media
        run: sudo --preserve-env bash run_in_container.sh build.sh full -p "${{ matrix.profile }}"

      - name: Verify uploaded artifact — ${{ matrix.profile }}
        working-directory: shani-install-media
        run: sudo --preserve-env bash run_in_container.sh build.sh verify -p "${{ matrix.profile }}"

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shani-image-${{ matrix.profile }}-${{ github.sha }}
          path: shani-install-media/cache/output/
          retention-days: 7

      - name: Notify Telegram — Build Failed
        if: failure() && github.event_name == 'workflow_dispatch'
        uses: shani8dev/shani-ci-commons/.github/actions/send-telegram@main
        with:
          status: failure
          message: |-
            **ShaniOS Image Build Failed**
            Profile: `${{ matrix.profile }}`
            Branch: `${{ github.ref_name }}`
            [View logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})

      - name: Notify Telegram — Build Succeeded
        if: success() && github.event_name == 'workflow_dispatch'
        uses: shani8dev/shani-ci-commons/.github/actions/send-telegram@main
        with:
          status: success
          message: |-
            **ShaniOS Image Build Complete**
            Profile: `${{ matrix.profile }}`
            Branch: `${{ github.ref_name }}`
            SHA: `${{ github.sha }}`
